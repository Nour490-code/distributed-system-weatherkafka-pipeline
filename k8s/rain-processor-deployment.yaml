apiVersion: apps/v1
kind: Deployment
metadata:
  name: rain-processor
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rain-processor
  template:
    metadata:
      labels:
        app: rain-processor
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka-svc 9092; do sleep 3; done"]
      containers:
        - name: rain-processor
          image: nourghazy/rain-processor:latest
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_TOPIC_READINGS
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: KAFKA_TOPIC_READINGS
            - name: KAFKA_TOPIC_ALERTS
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: KAFKA_TOPIC_ALERTS
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
