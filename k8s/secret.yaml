apiVersion: v1
kind: Secret
metadata:
  name: weather-secret
  namespace: default
type: Opaque
data:
  # echo -n 'weather_user' | base64  →  d2VhdGhlcl91c2Vy
  DB_USER: d2VhdGhlcl91c2Vy
  # echo -n 'weather_pass' | base64  →  d2VhdGhlcl9wYXNz
  DB_PASSWORD: d2VhdGhlcl9wYXNz
# ─────────────────────────────────────────────────────────────
# HOW TO REGENERATE (never hardcode plain-text creds):
#   echo -n 'your_username' | base64
#   echo -n 'your_password' | base64
# Then paste the output above and apply:
#   kubectl apply -f secret.yaml
# ─────────────────────────────────────────────────────────────
