apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName: standard   # uncomment and set if your cluster needs an explicit class
  #                              # Minikube uses 'standard'; GKE uses 'standard-rwo'; etc.
