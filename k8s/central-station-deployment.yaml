apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-station
  namespace: default
  labels:
    app: central-station
spec:
  replicas: 1   # always single consumer to keep batch-insert logic simple
  selector:
    matchLabels:
      app: central-station
  template:
    metadata:
      labels:
        app: central-station
    spec:
      # ── Init containers: wait for both Kafka AND Postgres ─────────────────
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka ..."
              until nc -z kafka-svc 9092; do sleep 3; done
              echo "Kafka ready."
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Postgres ..."
              until nc -z postgres-svc 5432; do sleep 3; done
              echo "Postgres ready."
      containers:
        # ── PLACEHOLDER image — swap for your real JAR image when ready ───────
        # Replace 'alpine:3.19' with something like:
        #   image: ghcr.io/<your-org>/central-station:latest
        - name: central-station
          image: nourghazy/central-station
          env:
            # ── Kafka config ─────────────────────────────────────────────────
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_TOPIC_READINGS
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: KAFKA_TOPIC_READINGS
            - name: KAFKA_TOPIC_ALERTS
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: KAFKA_TOPIC_ALERTS
            # ── DB config ────────────────────────────────────────────────────
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: weather-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weather-secret
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
