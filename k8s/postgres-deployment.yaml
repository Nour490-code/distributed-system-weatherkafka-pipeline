apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: default
data:
  # This script runs automatically on first startup (when the data directory is empty).
  init.sql: |
    CREATE TABLE IF NOT EXISTS weather_readings (
        id               BIGSERIAL    PRIMARY KEY,
        station_id       VARCHAR(50)       NOT NULL,
        s_no             BIGINT       NOT NULL,
        battery_status   VARCHAR(10)  NOT NULL,
        status_timestamp BIGINT       NOT NULL,
        humidity         INT          NOT NULL,
        temperature      INT          NOT NULL,
        wind_speed       INT          NOT NULL
    );

    
    CREATE INDEX IF NOT EXISTS idx_wr_station_id ON weather_readings (station_id);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: default
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: weather-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weather-secret
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata   # subdirectory avoids lost+found conflict
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d   # Postgres auto-runs *.sql here on init
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "weather_user", "-d", "weather_db"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "weather_user", "-d", "weather_db"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-script
          configMap:
            name: postgres-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: default
spec:
  selector:
    app: postgres
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
